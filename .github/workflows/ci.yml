name: build_test_publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # build job - compile and package
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
        
      - name: Install dependencies and build
        run: |
          echo "Building the application..."
          mvn clean install -DskipTests
        
  # test job - run automated test with a new setup
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Run tests
        run: |
          echo "Running tests..."
          mvn test
      
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-reports
          path: target/surefire-reports

  # publish job - build and push docker image
  publish:
    runs-on: ubuntu-latest
    needs: test
    env:
      DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
      DOCKER_TOKEN: ${{secrets.DOCKER_TOKEN}}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read version from pom.xml file
        id: version
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
        
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build \
            -t $DOCKER_USERNAME/taskflowapi:${{steps.version.outputs.VERSION}} \
            -t $DOCKER_USERNAME/taskflowapi:latest .
      
      - name: Scan Docker Image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{env.DOCKER_USERNAME}}/taskflowapi:${{steps.version.outputs.VERSION}}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push to Docker Hub
        run: |
          echo "Logging in to Docker Hub..."
          echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USERNAME --password-stdin
          echo "Pushing image to Docker Hub..."
          docker push $DOCKER_USERNAME/taskflowapi:${{steps.version.outputs.VERSION}}
          docker push $DOCKER_USERNAME/taskflowapi:latest
          
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{secrets.RENDER_DEPLOY_HOOK}}"